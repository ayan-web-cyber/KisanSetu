<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KisanSetu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Generates real, scannable QR codes for booking tokens (see svgQrTag() in script.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.3/qrcode.min.js"></script>
<!-- Decodes QR codes from the operator's camera feed (see scan* functions in script.js) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<!-- Served automatically by the Socket.IO server for real-time queue updates -->
<script src="/socket.io/socket.io.js"></script>
<!-- Voice booking: browser speech recognition wrapper + command parser.
     Pure front-end, no server dependency — see voice/*.js. Loaded before
     script.js since script.js wires them into the farmer booking wizard. -->
<script src="voice/voiceRecognition.js"></script>
<script src="voice/voiceCommandParser.js"></script>
<script src="script.js"></script>
</body>
</html>
